<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Manage Companies</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }
    input, button {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
    }
  </style>
</head>
<body>

<h2>Admin: Add a Company</h2>
<input type="text" id="companyName" placeholder="Company Name">
<input type="number" id="companyMinCgpa" placeholder="Minimum CGPA" step="0.1">
<input type="text" id="companyBranches" placeholder="Allowed Branches (comma-separated, e.g., CSE,IT,ECE)">
<input type="number" id="companyMaxBacklogs" placeholder="Max Backlogs Allowed" value="0">
<button onclick="addCompany()">Add Company</button>

<p id="addStatus"></p>

<script>
  async function addCompany() {
    const name = document.getElementById("companyName").value;
    const minCgpa = Number(document.getElementById("companyMinCgpa").value);
    const branchesInput = document.getElementById("companyBranches").value;
    const allowedBranches = branchesInput.split(",").map(b => b.trim());
    const maxBacklogs = Number(document.getElementById("companyMaxBacklogs").value);

    if (!name || !minCgpa || !branchesInput) {
      document.getElementById("addStatus").innerText = "Please fill all fields.";
      return;
    }

    const response = await fetch("http://localhost:5000/add-company", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, minCgpa, allowedBranches, maxBacklogs })
    });

    const data = await response.json();
    document.getElementById("addStatus").innerText = data.message || data.error || "Company added!";

    document.getElementById("companyName").value = "";
    document.getElementById("companyMinCgpa").value = "";
    document.getElementById("companyBranches").value = "";
    document.getElementById("companyMaxBacklogs").value = "0";
  }

  </script>

</body>
</html>

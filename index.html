<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Placement Eligibility Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }
    input, button {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
    }
    .company {
      background: #f0f0f0;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<h2>Check Your Eligibility</h2>
<input type="number" id="cgpaInput" placeholder="Enter your CGPA" step="0.1">
<input type="text" id="branchInput" placeholder="Enter your Branch (e.g., CSE)">
<input type="number" id="backlogsInput" placeholder="Enter number of backlogs" value="0">
<button onclick="checkEligibility()">Check</button>

<div id="results"></div>

<script>
  async function checkEligibility() {
  const cgpa = document.getElementById("cgpaInput").value;
  const branch = document.getElementById("branchInput").value;
  const backlogs = document.getElementById("backlogsInput").value;

  const response = await fetch(`https://placement-eligibility-checker-7v7n.onrender.com/check-eligibility?cgpa=${cgpa}&branch=${branch}&backlogs=${backlogs}`);
  const data = await response.json();

  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  if (data.error) {
    resultsDiv.innerHTML = `<p style="color: red;">${data.error}</p>`;
    return;
  }

  if (data.length === 0) {
    resultsDiv.innerHTML = "<p>No companies match your criteria.</p>";
    return;
  }

  data.forEach(company => {
    resultsDiv.innerHTML += `<div class="company">${company.name} (Min CGPA: ${company.minCgpa}, Branches: ${company.allowedBranches.join(", ")})</div>`;
  });
}

  </script>

</body>
</html>
